<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Sora:wght@500;600&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0e0e12;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(58,23,88,.4) 0%, transparent 45%),
      radial-gradient(circle at 88% 85%, rgba(212,175,55,.12) 0%, transparent 40%),
      radial-gradient(1px 1px at 22% 28%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 82% 45%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 42% 78%, rgba(255,255,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 68%, rgba(255,255,255,.35) 50%, transparent 51%);
    display: flex; align-items: center; justify-content: center;
    font-family: Sora, sans-serif; color: #ececef;
  }
  .card { display: flex; align-items: center; gap: 6vw; padding: 0 7vw; width: 100%; }
  .left { display: flex; flex-direction: column; gap: 2.6vh; flex: 1; }
  .brand { display: flex; align-items: center; gap: 1.4vw; }
  .brand svg { width: 5.2vw; height: 5.2vw; }
  .logo { font-family: Cinzel, serif; font-weight: 900; font-size: 4.6vw; letter-spacing: .1em; color: #f5d76e; line-height: 1; }
  .badge { align-self: flex-start; font-size: 1.4vw; font-weight: 600; letter-spacing: .1em; color: #9a9aa5; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: .7vh 1.2vw; }
  .tag { font-size: 2vw; font-weight: 600; color: #ececef; letter-spacing: .02em; }
  .tag span { color: #d4af37; }
  .sub { font-size: 1.35vw; color: #9a9aa5; }
  .right { display: flex; flex-direction: column; gap: 2.4vh; }
  .row { display: flex; gap: 1.6vw; }
  .p { width: 9vw; height: 9vw; border-radius: 50%; padding: .3vw; background: linear-gradient(135deg, #8b0a1a, #d4af37, #f5d76e); }
  .p img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0e0e12; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand">
        <svg viewBox="0 0 64 64"><path d="M32 10 L54 50 L10 50 Z" fill="none" stroke="#f5d76e" stroke-width="4" stroke-linejoin="round"/><path d="M32 24 L43 44 L21 44 Z" fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/></svg>
        <div class="logo">SAINT SEIYA EX</div>
      </div>
      <div class="badge">REBIRTH 2 · AWAKENING EX</div>
      <div class="tag">Codex <span>·</span> Team Builder <span>·</span> Tier List</div>
      <div class="sub">103 cavaleiros · 34 artefatos · 165 cartas — PT · EN · ES</div>
    </div>
    <div class="right">
      <div class="row">
        <div class="p"><img src="/circlehead/circleherohead_10780.png" alt=""></div>
        <div class="p"><img src="/circlehead/circleherohead_10270.png" alt=""></div>
      </div>
      <div class="row">
        <div class="p"><img src="/circlehead/circleherohead_10710.png" alt=""></div>
        <div class="p"><img src="/circlehead/circleherohead_10980.png" alt=""></div>
      </div>
    </div>
  </div>
</body>
</html>
